<!DOCTYPE html>
<html lang="en">
<head>  
    <meta charset="UTF-8">
    <!-- 🚀 IIT EXPERT FIX: Edge-to-Edge Display support for System Bars -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Grow Your Future</title>
    
    <!-- Google Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />
    
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">

    <!-- 🚀 IIT EXPERT FIX: Full iOS & Native App Engine Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Build Money">
    <!-- 🚀 IIT EXPERT FIX: Forced Fullscreen & Icon Routing -->
    <meta name="apple-touch-fullscreen" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="icon-192x192.png">

</head>
<body>
    <div id="native-splash" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #ffffff; z-index: 999999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.4s ease-out;">
        <img src="./icon-512x512.png" alt="App Logo" style="width: 110px; height: 110px; border-radius: 28px; box-shadow: 0 12px 28px rgba(27, 110, 53, 0.25); margin-bottom: 24px;">
        <div style="width: 36px; height: 36px; border: 4px solid #e5e7eb; border-top: 4px solid #1b6e35; border-radius: 50%; animation: splashSpin 1s linear infinite;"></div>
        <style>
            @keyframes splashSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        </style>
    </div>
    <div id="app-container">
        <!-- Content will dynamically load here -->
    </div>

    <!-- FIREBASE SDKs (Compat version for pure Vanilla JS) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <!-- Premium Custom Alert Component (Hidden By Default) -->
    <div id="custom-alert" class="custom-alert-overlay" style="display: none;">
        <div class="custom-alert-box">
            <span class="material-symbols-rounded alert-icon">info</span>
            <p id="custom-alert-message">Alert message here</p>
            <button id="custom-alert-btn">OK</button>
        </div>
    </div>

    <!-- Main App Logic -->
    <script src="app.js"></script>
</body>
</html>
